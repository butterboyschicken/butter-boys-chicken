<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" role="img" aria-labelledby="title description">
  <title id="title">Butter Boys Chicken</title>
  <desc id="description">A hand-painted Butter Boys wordmark above a red rooster wearing black sunglasses.</desc>
  <style>
    .paper { display: none; }
    .with-paper .paper { display: block; }
    .wordmark {
      fill: #101010;
      font-family: "Marker Felt", "Brush Script MT", "Segoe Print", cursive;
      font-size: 150px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -9px;
      paint-order: stroke;
      stroke: #101010;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4px;
    }
    .rough { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="paper" width="768" height="1024" fill="#f6f0e6"/>

  <g aria-label="Butter Boys wordmark">
