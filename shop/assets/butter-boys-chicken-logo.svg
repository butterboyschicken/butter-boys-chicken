    <text class="wordmark" x="380" y="286" text-anchor="middle" textLength="390" lengthAdjust="spacingAndGlyphs" transform="rotate(-4 380 286)">Boys</text>
    <text x="568" y="301" fill="#101010" font-family="Arial, sans-serif" font-size="29" font-weight="900">TM</text>
  </g>

